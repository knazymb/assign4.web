<main class="container py-5">
    <section class="form-card">
        <h1>Task 3: Bootstrap Validation</h1>
        <p>Enter your details to test the validation styles.</p>

        <form class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" name="name"
                       class="form-control" required maxlength="30">
                <div class="invalid-feedback">Name is required.</div>
                <div class="valid-feedback">Looks good!</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email"
                       class="form-control" required>
                <div class="invalid-feedback">Please enter a valid email.</div>
                <div class="valid-feedback">Looks good!</div>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" name="message"
                          class="form-control" rows="4"
                          required maxlength="300"></textarea>
                <div class="invalid-feedback">Please enter a message.</div>
                <div class="valid-feedback">Looks good!</div>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
            <button type="reset" class="btn btn-secondary">Reset</button>

            <p class="text-success mt-3" id="successMessage" hidden>
                Form submitted successfully!
            </p>
        </form>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
